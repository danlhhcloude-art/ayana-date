<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Аяна, один очень важный вопрос…">
  <meta name="theme-color" content="#ffd0e5">
  <title>Аяна, один вопрос… 💗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    html, body { height: 100%; }
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bounce { animation: bounce 2s ease infinite; }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    .wiggle { animation: wiggle 0.4s ease-in-out; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    .shy { animation: shy 3s ease-in-out infinite; display: inline-block; }
    @keyframes shy {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(4deg) scale(1.08); }
    }
    /* Летающие сердечки на фоне */
    .heart {
      position: fixed;
      bottom: -40px;
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }
    main { position: relative; z-index: 1; }
    .fade-in { animation: fadeIn 0.6s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <link rel="preload" as="image" href="./images/image1.gif">
  <link rel="preload" as="image" href="./images/image2.gif">
  <link rel="preload" as="image" href="./images/image3.gif">
  <link rel="preload" as="image" href="./images/image4.gif">
  <link rel="preload" as="image" href="./images/image5.gif">
  <link rel="preload" as="image" href="./images/image6.gif">
  <link rel="preload" as="image" href="./images/image7.gif">
</head>
<body class="gradient-background">
  <main class="flex items-center justify-center min-h-screen">
    <section class="flex flex-col items-center p-4 text-center max-w-xl">
      <p id="intro" class="text-lg text-[#c2497a] italic mb-3 fade-in">
        <span class="shy">🙈</span> Мне немного страшно это спрашивать, но я всё-таки решился…
      </p>
      <img
        id="imageDisplay"
        src="./images/image1.gif"
        alt="Милый котёнок с цветами"
        class="rounded-2xl h-[300px] object-cover shadow-lg"
      />
      <h1 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4 fade-in">
        Аяна, ты пойдёшь со мной на свидание? 💗
      </h1>
      <p id="subtext" class="text-base text-[#c2497a] mb-2">(я уже краснею, пока ты думаешь 😳)</p>
      <div id="responseButtons" class="flex gap-4 pt-5 items-center flex-wrap justify-center">
        <button
          id="yesButton"
          class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-xl text-xl font-medium cursor-pointer px-4 py-2 bg-green-500 text-white transition-all duration-300 ease-in-out hover:bg-green-400 min-h-12 min-w-[90px] shadow-md"
        >
          Да 🥰
        </button>
        <button
          id="noButton"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-xl text-xl font-medium cursor-pointer px-4 py-2 bg-red-400 text-white transition-colors hover:bg-red-500 h-12 min-w-[90px] shadow-md"
        >
          Нет
        </button>
      </div>
      <p id="afterText" class="hidden text-xl text-[#c2497a] mt-4 fade-in">
        Я напишу тебе, когда и куда. Обещаю, будет уютно 🫶
      </p>
    </section>
  </main>

  <script>
    (() => {
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');
      const intro = document.getElementById('intro');
      const subtext = document.getElementById('subtext');
      const afterText = document.getElementById('afterText');

      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 20;
      const MAX_NO_CLICKS = 5;

      const IMAGE_PATHS = [
        './images/image1.gif',
        './images/image2.gif',
        './images/image3.gif',
        './images/image4.gif',
        './images/image5.gif',
        './images/image6.gif',
        './images/image7.gif',
      ];

      // Текст кнопки «Нет» — с каждым нажатием всё жалобнее
      const NO_BUTTON_MESSAGES = [
        'Нет',
        'Ты уверена?.. 🥺',
        'Аяна, ну пожалуйста…',
        'Я так долго собирался с духом 😣',
        'Ты разбиваешь мне сердце 💔',
        'Я сейчас заплачу… 😭',
      ];

      // Подпись под вопросом — тоже меняется
      const SUBTEXTS = [
        '(я уже краснею, пока ты думаешь 😳)',
        '(может, ты просто промахнулась? 🙈)',
        '(я даже цветы уже выбрал… 🌷)',
        '(я буду очень-очень стараться 🥹)',
        '(честно, я не умею сдаваться 😶‍🌫️)',
        '(кнопка «Да» уже почти весь экран, намёк понят? 😳)',
      ];

      const ALT_TEXTS = [
        'Милый котёнок с цветами',
        'Грустный котёнок смотрит вверх',
        'Котёнок умоляет',
        'Котёнок с разбитым сердцем',
        'Плачущий котёнок',
        'Совсем расстроенный котёнок',
        'Счастливый котёнок празднует',
      ];

      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 90;
      let fontSize = 20;

      // Фоновые сердечки
      const HEARTS = ['💗', '💕', '🩷', '💞', '🌸'];
      function spawnHeart() {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = 14 + Math.random() * 20 + 'px';
        h.style.animationDuration = 7 + Math.random() * 6 + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 14000);
      }
      setInterval(spawnHeart, 700);

      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;
        noClickCount++;

        imageDisplay.src = IMAGE_PATHS[noClickCount];
        imageDisplay.alt = ALT_TEXTS[noClickCount];

        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;
        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
        subtext.textContent = SUBTEXTS[noClickCount];

        // Кнопка «Нет» смущённо дёргается
        noButton.classList.remove('wiggle');
        void noButton.offsetWidth;
        noButton.classList.add('wiggle');
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        imageDisplay.alt = ALT_TEXTS[ALT_TEXTS.length - 1];
        intro.textContent = '🥰';
        valentineQuestion.textContent = 'Урааа!! Аяна, ты сделала меня самым счастливым 💗';
        subtext.textContent = '';
        responseButtons.style.display = 'none';
        afterText.classList.remove('hidden');

        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });
        const defaults = { spread: 360, ticks: 120, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };
        confetti({ ...defaults, particleCount: 60, scalar: 2 });
        confetti({ ...defaults, particleCount: 30, scalar: 3 });
        confetti({ ...defaults, particleCount: 12, scalar: 4 });
        setTimeout(() => confetti({ ...defaults, particleCount: 40, scalar: 2.5 }), 900);
      });
    })();
  </script>
</body>
</html>
