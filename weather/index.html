<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Погода у тебя, и что я по этому поводу думаю.">
  <meta name="theme-color" content="#0b1424">
  <title>Погода у тебя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Manrope', system-ui, sans-serif; color: #eef4ff; background: linear-gradient(180deg, #0b1424, #142a44 60%, #0b1424); min-height: 100vh; overflow-x: hidden; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 60px; text-align: center; }
    .tag { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #8fd3ff; text-shadow: 0 0 8px rgba(143,211,255,.6); }
    h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(22px, 6.5vw, 32px); margin: 6px 0 8px; text-shadow: 0 0 12px rgba(143,211,255,.5); }
    .lead { color: #c9d8f0; font-size: 15px; line-height: 1.55; margin: 0 auto 16px; max-width: 400px; }
    .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
    .big { font-size: 72px; line-height: 1; filter: drop-shadow(0 0 16px rgba(255,255,255,.3)); }
    .temp { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 54px; margin: 6px 0 0; }
    .desc { font-size: 15px; color: #c9d8f0; margin-top: 2px; }
    .place { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: #8fd3ff; margin-top: 10px; }
    .say { font-family: 'Caveat', cursive; font-size: clamp(22px, 6.5vw, 30px); line-height: 1.2; color: #fff; margin: 16px 0 6px; text-shadow: 0 0 12px rgba(143,211,255,.4); }
    .adv { font-size: 14px; color: #c9d8f0; line-height: 1.6; }
    .adv b { color: #ffd36b; }
    .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .btn { font: inherit; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .05em; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 12px 20px; cursor: pointer; text-decoration: none; }
    .btn.blue { border-color: #8fd3ff; box-shadow: 0 0 12px rgba(143,211,255,.5); }
    input { font: inherit; width: 100%; max-width: 300px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: #fff; margin: 8px 0; text-align: center; }
    .hidden { display: none !important; }
    .foot { color: #8fa3c7; font-size: 12px; margin-top: 26px; }
    .foot a { color: #ffb3cf; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">за окном</div>
    <h1>Погода у тебя</h1>
    <p class="lead">Аяна, я не могу быть рядом каждую минуту, но могу посмотреть, что у тебя за окном, и сказать, что надеть. Разреши странице узнать, где ты, или напиши город.</p>
    <div class="card" id="card">
      <div id="ask">
        <div class="big">🌤️</div>
        <div class="row"><button class="btn blue" id="geoBtn">где я сейчас</button></div>
        <div style="margin-top:14px;font-size:13px;color:#8fa3c7">или</div>
        <input id="city" placeholder="город, например Алматы"><div class="row"><button class="btn" id="cityBtn">посмотреть</button></div>
      </div>
      <div id="res" class="hidden">
        <div class="big" id="icon"></div>
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>
        <div class="place" id="place"></div>
        <div class="say" id="say"></div>
        <div class="adv" id="adv"></div>
        <div class="row"><button class="btn" id="backBtn">другой город</button></div>
      </div>
      <div id="err" class="hidden" style="color:#ffb3cf;margin-top:10px;font-size:14px"></div>
    </div>
    <div class="foot">данные: open-meteo.com · <a href="../hub/">← все игры для Аяны</a></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // код погоды WMO → иконка, описание, что я скажу, совет
  const W = (code) => {
    if (code === 0) return ['☀️', 'ясно', 'У тебя солнце. Оно, конечно, не такое яркое, как ты, но старается.', 'Выйди на десять минут на улицу. Солнце полезно. Я бы пошёл с тобой.'];
    if (code <= 2) return ['🌤️', 'немного облаков', 'Облака у тебя лёгкие, как моё настроение, когда ты пишешь.', 'Погода для прогулки. Если решишь, напиши, я пойду рядом мысленно.'];
    if (code === 3) return ['☁️', 'пасмурно', 'Серо. Но знаешь, что я заметил? Ты умеешь светиться в любую погоду.', 'Включи тёплый свет, завари что-нибудь. Пасмурность это уют, если правильно её приготовить.'];
    if (code <= 48) return ['🌫️', 'туман', 'Туман. Красиво и чуть таинственно. Как ты в первый день.', 'Осторожнее на дороге. И надень что-то тёплое, в тумане холоднее, чем кажется.'];
    if (code <= 57) return ['🌦️', 'морось', 'Мелкий дождь. Такой, под которым хорошо идти и молчать вдвоём.', 'Капюшон или зонт. Хотя лучше зонт: его можно на двоих.'];
    if (code <= 67) return ['🌧️', 'дождь', 'У тебя дождь. У меня в первой игре тоже был дождь. Там ты ловила звёзды. Здесь лови зонт.', 'Зонт обязательно. Сапоги желательно. Горячий чай после — настоятельно.'];
    if (code <= 77) return ['❄️', 'снег', 'Снег! Выйди на минуту и поймай снежинку. Я мысленно ловлю рядом.', 'Шарф, шапка, варежки. Если варежек нет, карманы. Если карманов нет, моя рука.'];
    if (code <= 82) return ['🌧️', 'ливень', 'Льёт. Самое время никуда не идти и позволить себе плед.', 'Если можно остаться дома, останься. Если нельзя, зонт побольше и шаг помедленнее.'];
    if (code <= 86) return ['🌨️', 'снегопад', 'Снегопад. Город становится тихим. Я люблю такие вечера. Особенно с тобой.', 'Тёплая обувь и не спешить. И посмотри на фонарь: снег под ним красивее всего.'];
    return ['⛈️', 'гроза', 'Гроза. Если страшно, вот моя рука. Держи, пока не закончится.', 'Дома лучше. Телефон на зарядку, чай в руки. Я рядом.'];
  };
  const tempSay = (t) => t <= -15 ? 'Очень холодно. Я бы отдал тебе все свои куртки сразу.' : t <= -5 ? 'Мороз. Надень то, в чём ты похожа на уютный шарик. Мне нравится.' : t <= 5 ? 'Прохладно. Шарф, пожалуйста. Я серьёзно.' : t <= 15 ? 'Свежо. Лёгкая куртка и хорошее настроение.' : t <= 24 ? 'Идеально. Такая погода бывает редко, как ты.' : 'Жарко. Пей воду. Я напомню ещё раз: пей воду.';
  const show = (name, cur) => {
    const [ic, d, s, a] = W(cur.weather_code); const t = Math.round(cur.temperature_2m);
    $('icon').textContent = ic; $('temp').textContent = (t > 0 ? '+' : '') + t + '°'; $('desc').textContent = `${d} · ощущается как ${Math.round(cur.apparent_temperature)}° · ветер ${Math.round(cur.wind_speed_10m)} км/ч`;
    $('place').textContent = name; $('say').textContent = s; $('adv').innerHTML = `<b>что надеть:</b> ${tempSay(t)}<br><b>совет:</b> ${a}`;
    $('ask').classList.add('hidden'); $('res').classList.remove('hidden'); $('err').classList.add('hidden');
  };
  const err = (m) => { $('err').textContent = m; $('err').classList.remove('hidden'); };
  const load = async (lat, lon, name) => {
    try { const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`); const j = await r.json(); show(name, j.current); } catch { err('Не получилось узнать погоду. Проверь интернет и попробуй ещё раз.'); }
  };
  $('geoBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return err('Телефон не отдаёт геолокацию. Напиши город.');
    $('geoBtn').textContent = 'смотрю…';
    navigator.geolocation.getCurrentPosition((p) => load(p.coords.latitude, p.coords.longitude, 'у тебя за окном'),() => { $('geoBtn').textContent = 'где я сейчас'; err('Не разрешила геолокацию. Ничего, напиши город.'); }, { timeout: 10000 });
  });
  const byCity = async () => {
    const q = $('city').value.trim(); if (!q) return;
    try { const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ru`); const j = await r.json(); if (!j.results?.length) return err('Такой город не нашёл. Попробуй написать иначе.'); const c = j.results[0]; load(c.latitude, c.longitude, `${c.name}${c.country ? ', ' + c.country : ''}`); localStorage.setItem('ayana.weather.city', q); } catch { err('Не получилось. Проверь интернет.'); }
  };
  $('cityBtn').addEventListener('click', byCity); $('city').addEventListener('keydown', (e) => { if (e.key === 'Enter') byCity(); });
  $('backBtn').addEventListener('click', () => { $('res').classList.add('hidden'); $('ask').classList.remove('hidden'); });
  const saved = localStorage.getItem('ayana.weather.city'); if (saved) { $('city').value = saved; byCity(); }
})();
</script>
</body>
</html>
