<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Кнопка «я скучаю». Нажимай, когда скучаешь.">
  <meta name="theme-color" content="#120a16">
  <title>Я скучаю</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Manrope', system-ui, sans-serif; color: #fff2f8; background: radial-gradient(60% 45% at 50% 60%, rgba(255,92,138,.18), transparent 70%), linear-gradient(180deg, #120a16, #221229); min-height: 100vh; overflow-x: hidden; user-select: none; -webkit-user-select: none; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 60px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    .tag { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #ffb3cf; text-shadow: 0 0 8px rgba(255,92,138,.6); }
    h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(22px, 6.5vw, 32px); margin: 6px 0 8px; text-shadow: 0 0 12px rgba(255,92,138,.6); }
    .lead { color: #e2d3ea; font-size: 15px; line-height: 1.55; margin: 0 auto 24px; max-width: 400px; }
    .big { width: min(70vw, 260px); height: min(70vw, 260px); border-radius: 50%; margin: 0 auto; border: 0; cursor: pointer; font: inherit; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(18px, 5.5vw, 26px); color: #fff; background: radial-gradient(circle at 35% 30%, #ff8fb3, #d8356f 70%); box-shadow: 0 0 0 10px rgba(255,92,138,.15), 0 0 40px rgba(255,92,138,.6), 0 20px 50px rgba(0,0,0,.5); transition: transform .12s; animation: pulse 2.4s ease-in-out infinite; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 22px rgba(255,92,138,.08), 0 0 60px rgba(255,92,138,.8), 0 20px 50px rgba(0,0,0,.5); } }
    .big:active { transform: scale(.94); }
    .reply { min-height: 90px; margin-top: 26px; font-family: 'Caveat', cursive; font-size: clamp(24px, 7vw, 32px); line-height: 1.2; color: #fff; text-shadow: 0 0 14px rgba(255,92,138,.5); opacity: 0; transform: translateY(8px); transition: .5s; padding: 0 10px; }
    .reply.show { opacity: 1; transform: none; }
    .stats { margin-top: 10px; font-size: 13px; color: #c9b3d6; line-height: 1.7; }
    .stats b { color: #ffd36b; }
    .heart { position: fixed; pointer-events: none; font-size: 24px; animation: up 1.8s ease-out forwards; z-index: 5; }
    @keyframes up { 0% { transform: translate(-50%, 0) scale(.6); opacity: 1; } 100% { transform: translate(-50%, -220px) scale(1.4) rotate(20deg); opacity: 0; } }
    .foot { color: #a08bb0; font-size: 12px; margin-top: 26px; }
    .foot a { color: #ff9ab8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">когда скучаешь</div>
    <h1>Нажми, если скучаешь</h1>
    <p class="lead">Аяна, эта кнопка для тех минут, когда меня нет рядом, а хочется. Нажимай сколько угодно. Я отвечу каждый раз.</p>
    <button class="big" id="btn">я скучаю</button>
    <div class="reply" id="reply"></div>
    <div class="stats" id="stats"></div>
    <div class="foot"><a href="../hub/">← все игры для Аяны</a> · <a href="../hug/">обнять →</a></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('ayana.miss.' + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('ayana.miss.' + k, JSON.stringify(v)); } catch {} } };
  let n = store.get('n', 0);
  const R = [
    'Я тоже. Прямо сейчас. Ты даже не представляешь, как сильно.',
    'Знаю. Я скучаю с того момента, как мы попрощались.',
    'И я. Я бы сейчас всё бросил и приехал.',
    'Ты нажала, и я почувствовал. Серьёзно, у меня что-то ёкнуло.',
    'Я тоже скучаю. Это, наверное, уже хроническое.',
    'Скучаю так, что считаю часы. Их слишком много.',
    'И я по тебе. Каждую минуту, которую ты не рядом.',
    'Скучать по тебе я умею лучше всего. Ну, после «любить».',
    'Я тоже. Закрой глаза, я здесь. Вот, обнял.',
    'Да. Я тоже. Это взаимно так, что даже неловко.',
    'Скучаю. Пойду посмотрю на твоё имя в телефоне. Помогает минуты на две.',
    'И я скучаю, Аяна. Но знаешь, что хорошо? Это значит, что есть по кому.',
    'Я тоже. Скоро увидимся. Я уже всё придумал.',
    'Скучаю по твоему смеху. Засмейся сейчас, я, кажется, услышу.',
    'Ты скучаешь, я скучаю. Математика говорит: пора встретиться.',
    'И я. Эта кнопка теперь моя любимая на свете.',
    'Скучаю. Так, что написал тебе целый сайт. Это намёк.',
    'Я тоже, очень. Держись. Я уже рядом, просто пока невидимый.',
    'Да. И люблю. Это обычно идёт вместе.',
    'Скучаю. Нажми ещё раз, я отвечу ещё раз. Я не устану.',
  ];
  const MILE = { 1: 'Первый раз. Запомню этот момент.', 5: 'Пять раз. Это уже не случайность.', 10: 'Десять. Я официально самый скучающий человек в ответ.', 25: 'Двадцать пять. Мне кажется, нам пора видеться чаще.', 50: 'Пятьдесят. Аяна, я тебя люблю. Просто чтобы ты знала, зачем всё это.', 100: 'Сто. Ты нажала сто раз, и я сто раз ответил. И отвечу ещё сто.' };
  const stats = () => { $('stats').innerHTML = `ты скучала <b>${n}</b> раз · я скучал <b>${n + 1}</b> раз<br><span style="font-size:12px">(я всегда на один больше, так уж вышло)</span>`; };
  stats();
  $('btn').addEventListener('click', (e) => {
    n++; store.set('n', n);
    const txt = MILE[n] || R[Math.random() * R.length | 0];
    const r = $('reply'); r.classList.remove('show'); setTimeout(() => { r.textContent = txt; r.classList.add('show'); }, 120);
    stats();
    if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
    for (let i = 0; i < 6; i++) setTimeout(() => { const h = document.createElement('span'); h.className = 'heart'; h.textContent = ['💗', '💕', '🩷', '💞'][i % 4]; const b = $('btn').getBoundingClientRect(); h.style.left = b.left + b.width * (0.2 + Math.random() * 0.6) + 'px'; h.style.top = b.top + b.height * 0.3 + 'px'; document.body.appendChild(h); setTimeout(() => h.remove(), 1800); }, i * 80);
  });
})();
</script>
</body>
</html>
