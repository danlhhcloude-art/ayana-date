<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Обними. Держи, сколько хочешь.">
  <meta name="theme-color" content="#140a12">
  <title>Обними</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --warm: 0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: 'Manrope', system-ui, sans-serif; color: #fff4f7; background: #140a12; touch-action: none; user-select: none; -webkit-user-select: none; }
    #bg { position: fixed; inset: 0; background: radial-gradient(70% 60% at 50% 55%, rgba(255,92,138,calc(.15 + var(--warm) * .5)), transparent 70%), linear-gradient(180deg, #140a12, #2a0f1e); transition: background .3s; }
    .top { position: fixed; top: 0; left: 0; right: 0; padding: 22px 20px; text-align: center; z-index: 3; pointer-events: none; }
    .tag { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #ff9ab8; text-shadow: 0 0 8px rgba(255,92,138,.6); }
    h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(24px, 7vw, 34px); margin: 6px 0 6px; text-shadow: 0 0 12px #ff5c8a, 0 0 30px rgba(255,92,138,.5); }
    .lead { font-size: 14px; color: #e9cfd9; line-height: 1.5; max-width: 340px; margin: 0 auto; }
    .center { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .heart { width: min(62vw, 300px); height: min(62vw, 300px); position: relative; cursor: pointer; transform: scale(1); transition: transform .12s; }
    .heart svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 calc(18px + var(--warm) * 40px) rgba(255,92,138,calc(.5 + var(--warm) * .5))); }
    .heart.held { animation: beat var(--bpm, 1s) ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.08); } 35% { transform: scale(1.02); } 50% { transform: scale(1.1); } }
    .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: 'Unbounded', sans-serif; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.8); pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6); transition: opacity .3s; }
    .heart.held .hint { opacity: 0; }
    .timer { position: fixed; left: 0; right: 0; bottom: 26vh; text-align: center; z-index: 3; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(34px, 12vw, 64px); color: #fff; text-shadow: 0 0 18px rgba(255,92,138,.7); opacity: 0; transition: .3s; pointer-events: none; font-variant-numeric: tabular-nums; }
    .timer.show { opacity: 1; }
    .timer small { display: block; font-size: 11px; letter-spacing: .3em; font-weight: 400; color: #ffb3cc; margin-top: 4px; }
    .say { position: fixed; left: 20px; right: 20px; bottom: 12vh; text-align: center; z-index: 3; font-family: 'Caveat', cursive; font-size: clamp(24px, 7vw, 34px); line-height: 1.15; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6), 0 0 14px rgba(255,92,138,.5); opacity: 0; transform: translateY(8px); transition: .6s; pointer-events: none; }
    .say.show { opacity: 1; transform: none; }
    .rec { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 3; font-size: 12px; color: #c9a3b3; }
    .rec b { color: #ffd36b; }
    .rec a { color: #ff9ab8; text-decoration: none; margin-left: 12px; }
    .spark { position: fixed; pointer-events: none; z-index: 4; font-size: 16px; animation: up 1.6s ease-out forwards; }
    @keyframes up { 0% { transform: translate(-50%, 0) scale(.6); opacity: 1; } 100% { transform: translate(-50%, -140px) scale(1.2); opacity: 0; } }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div class="top"><div class="tag">обними</div><h1>Положи руку сюда</h1><p class="lead">Нажми на сердце и держи. Это я тебя обнимаю. Отпускай, когда захочешь. Я бы не отпускал.</p></div>
  <div class="center">
    <div class="heart" id="heart">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fb3"/><stop offset="1" stop-color="#d8356f"/></linearGradient></defs>
        <path d="M50 88 C20 66 8 50 8 34 A18 18 0 0 1 50 24 A18 18 0 0 1 92 34 C92 50 80 66 50 88Z" fill="url(#g)"/>
        <ellipse cx="34" cy="38" rx="7" ry="11" transform="rotate(-25 34 38)" fill="rgba(255,255,255,.28)"/>
      </svg>
      <div class="hint">держи</div>
    </div>
  </div>
  <div class="timer" id="timer">0<small>секунд объятия</small></div>
  <div class="say" id="say"></div>
  <div class="rec" id="rec"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('ayana.hug.' + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('ayana.hug.' + k, JSON.stringify(v)); } catch {} } };
  let best = store.get('best', 0), total = store.get('total', 0), count = store.get('count', 0);
  const LINES = [
    [2, 'вот так. не торопись.'],
    [5, 'чувствуешь? это моё сердце. оно всегда так рядом с тобой.'],
    [9, 'я бы стоял так весь вечер. и утро тоже.'],
    [14, 'если тебе было тяжело сегодня, отдай это мне. я выдержу.'],
    [20, 'двадцать секунд. это уже не объятие. это дом.'],
    [30, 'полминуты. Аяна, я тебя люблю. тихо, чтобы не спугнуть.'],
    [45, 'ты всё ещё здесь. я тоже. я всегда буду здесь.'],
    [60, 'целая минута. рекорд не важен. важно, что ты не отпускала.'],
    [90, 'ладно, теперь ты точно знаешь, как сильно. можно отпускать. или нет.'],
  ];
  const AFTER = [
    'Это было объятие на {s}. Я бы держал дольше.',
    '{s}. Я считал каждую. Спасибо, что не отпускала.',
    'Объятие на {s}. Запомню. Повторим, когда захочешь.',
    '{s} тепла. Теперь у меня есть запас до завтра.',
  ];
  const plural = (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'секунду' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'секунды' : 'секунд'}`;
  const heart = $('heart'), timer = $('timer'), say = $('say');
  let held = false, t0 = 0, raf = 0, lastLine = -1, beatTimer = null, bpmMs = 1000;
  const setWarm = (v) => document.documentElement.style.setProperty('--warm', String(Math.min(1, v)));
  const rec = () => { $('rec').innerHTML = `самое долгое объятие: <b>${plural(best)}</b> · всего обнимались: <b>${count}</b> раз <a href="../hub/">← все игры</a>`; };
  rec();
  const spark = () => { const r = heart.getBoundingClientRect(); const s = document.createElement('span'); s.className = 'spark'; s.textContent = ['💗', '🩷', '✨', '💞'][Math.random() * 4 | 0]; s.style.left = r.left + r.width * (0.2 + Math.random() * 0.6) + 'px'; s.style.top = r.top + r.height * 0.3 + 'px'; document.body.appendChild(s); setTimeout(() => s.remove(), 1600); };
  const beat = () => { if (!held) return; if (navigator.vibrate) navigator.vibrate([40, 90, 60]); if (Math.random() < 0.5) spark(); beatTimer = setTimeout(beat, bpmMs); };
  const tick = () => {
    if (!held) return;
    const s = (performance.now() - t0) / 1000; const sec = Math.floor(s);
    timer.firstChild.nodeValue = sec; setWarm(s / 40);
    bpmMs = Math.max(700, 1000 - s * 6); heart.style.setProperty('--bpm', bpmMs + 'ms');
    const li = LINES.findIndex(([at]) => at > s) - 1; const idx = li < 0 ? (s >= LINES[LINES.length - 1][0] ? LINES.length - 1 : -1) : li;
    if (idx !== lastLine && idx >= 0) { lastLine = idx; say.textContent = LINES[idx][1]; say.classList.remove('show'); void say.offsetWidth; say.classList.add('show'); }
    raf = requestAnimationFrame(tick);
  };
  const start = (e) => { if (held) return; held = true; t0 = performance.now(); lastLine = -1; heart.classList.add('held'); timer.classList.add('show'); say.classList.remove('show'); try { heart.setPointerCapture(e.pointerId); } catch {} beat(); tick(); };
  const end = () => {
    if (!held) return; held = false; cancelAnimationFrame(raf); clearTimeout(beatTimer); heart.classList.remove('held'); setWarm(0);
    const sec = Math.floor((performance.now() - t0) / 1000); if (sec < 1) { timer.classList.remove('show'); return; }
    count++; total += sec; if (sec > best) best = sec; store.set('best', best); store.set('total', total); store.set('count', count); rec();
    say.textContent = AFTER[Math.random() * AFTER.length | 0].replace('{s}', plural(sec)) + (sec >= best && sec > 5 ? ' Это рекорд.' : ''); say.classList.add('show');
    setTimeout(() => timer.classList.remove('show'), 1500);
  };
  heart.addEventListener('pointerdown', start); heart.addEventListener('pointerup', end); heart.addEventListener('pointercancel', end); heart.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') end(); });
  addEventListener('blur', end);
})();
</script>
</body>
</html>
