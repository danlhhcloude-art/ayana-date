<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Котик Аяны. Его можно гладить.">
  <meta name="theme-color" content="#1a1226">
  <title>Котик Аяны</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Manrope', system-ui, sans-serif; color: #fff2f8; background: linear-gradient(180deg, #1a1226, #2a1a3a 60%, #1a1226); min-height: 100vh; overflow-x: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 60px; text-align: center; }
    .tag { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #ffb3cf; text-shadow: 0 0 8px rgba(255,92,138,.6); }
    h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(24px, 7vw, 34px); margin: 6px 0 8px; text-shadow: 0 0 12px rgba(255,92,138,.6); }
    .lead { color: #e2d3ea; font-size: 15px; line-height: 1.55; margin: 0 auto 10px; max-width: 400px; }
    .stage { position: relative; width: min(88vw, 360px); height: min(88vw, 360px); margin: 10px auto; cursor: pointer; }
    svg { width: 100%; height: 100%; overflow: visible; }
    .bubble { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: #fff; color: #4a2a3a; border-radius: 16px; padding: 8px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; max-width: 90vw; box-shadow: 0 8px 20px rgba(0,0,0,.3); opacity: 0; transition: .3s; pointer-events: none; }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
    .bubble.show { opacity: 1; }
    .eye { transition: ry .15s; }
    .tail { transform-origin: 250px 300px; animation: tail 2.4s ease-in-out infinite; }
    @keyframes tail { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    .stage.pet .tail { animation-duration: 1s; }
    .body { transform-origin: 200px 300px; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scaleY(1.02); } }
    .stage.pet .body { animation: purr .18s linear infinite; }
    @keyframes purr { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(1px, -1px); } }
    .heart { position: absolute; pointer-events: none; font-size: 22px; animation: up 1.4s ease-out forwards; }
    @keyframes up { 0% { transform: translate(-50%, 0) scale(.6); opacity: 1; } 100% { transform: translate(-50%, -130px) scale(1.3); opacity: 0; } }
    .stats { font-size: 13px; color: #c9b3d6; }
    .stats b { color: #ffd36b; }
    .mood { font-family: 'Caveat', cursive; font-size: 26px; color: #fff; margin: 8px 0 0; min-height: 34px; }
    .foot { color: #a08bb0; font-size: 12px; margin-top: 26px; }
    .foot a { color: #ff9ab8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">его зовут Мурзик. или как ты скажешь</div>
    <h1>Котик Аяны</h1>
    <p class="lead">Я завёл тебе котика. Он живёт здесь и ждёт, когда ты зайдёшь. Погладь его: нажми и держи. Он мурчит по-настоящему.</p>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble"></div>
      <svg viewBox="0 0 400 400">
        <g class="tail"><path d="M250 300 q70 -10 60 -80 q-5 -25 15 -30" fill="none" stroke="#f1b0c8" stroke-width="22" stroke-linecap="round"/></g>
        <g class="body">
          <ellipse cx="200" cy="300" rx="110" ry="70" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4"/>
          <ellipse cx="150" cy="350" rx="26" ry="14" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4"/>
          <ellipse cx="250" cy="350" rx="26" ry="14" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4"/>
          <path d="M110 200 L100 110 L170 160 Z" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4" stroke-linejoin="round"/>
          <path d="M290 200 L300 110 L230 160 Z" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4" stroke-linejoin="round"/>
          <path d="M118 185 L112 130 L160 165 Z" fill="#ffc4d8"/><path d="M282 185 L288 130 L240 165 Z" fill="#ffc4d8"/>
          <circle cx="200" cy="210" r="95" fill="#fff6f9" stroke="#f0b4c9" stroke-width="4"/>
          <ellipse cx="145" cy="240" rx="20" ry="11" fill="#ff8fb3" opacity=".55"/><ellipse cx="255" cy="240" rx="20" ry="11" fill="#ff8fb3" opacity=".55"/>
          <g id="eyes">
            <ellipse class="eye" id="eL" cx="165" cy="205" rx="12" ry="16" fill="#4a2a3a"/><ellipse class="eye" id="eR" cx="235" cy="205" rx="12" ry="16" fill="#4a2a3a"/>
            <circle cx="170" cy="199" r="4" fill="#fff"/><circle cx="240" cy="199" r="4" fill="#fff"/>
          </g>
          <path d="M192 228 l8 8 l8 -8 z" fill="#ff8fb3"/>
          <path d="M184 240 q8 10 16 0 q8 10 16 0" fill="none" stroke="#4a2a3a" stroke-width="3.5" stroke-linecap="round"/>
          <g stroke="#e9b4c8" stroke-width="3" stroke-linecap="round"><path d="M90 225 l50 5"/><path d="M90 245 l50 -3"/><path d="M310 225 l-50 5"/><path d="M310 245 l-50 -3"/></g>
        </g>
      </svg>
    </div>
    <div class="mood" id="mood">спит. нет, уже не спит. увидел тебя.</div>
    <div class="stats">погладили <b id="pets">0</b> раз · настроение <b id="happy">0%</b></div>
    <div class="foot"><a href="../hub/">← все игры для Аяны</a></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('ayana.cat.' + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('ayana.cat.' + k, JSON.stringify(v)); } catch {} } };
  let pets = store.get('pets', 0), happy = store.get('happy', 20);
  const SAY = ['мяу. (это значит «она лучшая»)', 'мурррр', 'ещё. ещё чуть-чуть.', 'мяу-мяу. (перевод: он тоже скучает)', 'мурр. у тебя тёплые руки.', 'мяу. (он просил передать: люблю)', 'прррр… не уходи.', 'мяу? (это он спрашивает, как ты)', 'мурр-мурр. ты самая.', 'мяу. он сказал, что ты красивая. я согласен.'];
  const MOOD = ['подозрительно смотрит. но добрый.', 'уже мурчит.', 'подставляет ушко.', 'совсем растаял.', 'лежит на спине. это высшая степень доверия.', 'мурчит так, что слышно соседям.', 'он тебя обожает. я тоже.'];
  const stage = $('stage');
  const upd = () => { $('pets').textContent = pets; $('happy').textContent = Math.round(happy) + '%'; $('mood').textContent = MOOD[Math.min(MOOD.length - 1, Math.floor(happy / 15))]; store.set('pets', pets); store.set('happy', happy); };
  upd();
  // моргание
  setInterval(() => { if (stage.classList.contains('pet')) return; $('eL').setAttribute('ry', 2); $('eR').setAttribute('ry', 2); setTimeout(() => { if (!stage.classList.contains('pet')) { $('eL').setAttribute('ry', 16); $('eR').setAttribute('ry', 16); } }, 150); }, 3200);
  // мурчание на WebAudio
  let ac, g, o, lfo;
  const purrOn = () => { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 26; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; g = ac.createGain(); g.gain.value = 0; lfo = ac.createOscillator(); lfo.frequency.value = 24; const lg = ac.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(g.gain); o.connect(lp); lp.connect(g); g.connect(ac.destination); o.start(); lfo.start(); } if (ac.state === 'suspended') ac.resume(); g.gain.cancelScheduledValues(ac.currentTime); g.gain.linearRampToValueAtTime(0.6, ac.currentTime + 0.3); };
  const purrOff = () => { if (!ac) return; g.gain.cancelScheduledValues(ac.currentTime); g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.4); };
  let petting = false, vib = null, heartTimer = null, bubbleTimer = null, t0 = 0;
  const heart = (x, y) => { const h = document.createElement('span'); h.className = 'heart'; h.textContent = ['💗', '💕', '🩷', '✨'][Math.random() * 4 | 0]; h.style.left = x + 'px'; h.style.top = y + 'px'; stage.appendChild(h); setTimeout(() => h.remove(), 1400); };
  const say = (t) => { const b = $('bubble'); b.textContent = t; b.classList.add('show'); clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove('show'), 2200); };
  const start = (e) => { if (petting) return; petting = true; t0 = Date.now(); stage.classList.add('pet'); $('eL').setAttribute('ry', 2); $('eR').setAttribute('ry', 2); purrOn(); if (navigator.vibrate) vib = setInterval(() => navigator.vibrate(30), 120); heartTimer = setInterval(() => { const r = stage.getBoundingClientRect(); heart(r.width * (0.3 + Math.random() * 0.4), r.height * 0.45); }, 350); say(SAY[Math.random() * SAY.length | 0]); };
  const end = () => { if (!petting) return; petting = false; stage.classList.remove('pet'); $('eL').setAttribute('ry', 16); $('eR').setAttribute('ry', 16); purrOff(); clearInterval(vib); clearInterval(heartTimer); const s = (Date.now() - t0) / 1000; pets++; happy = Math.min(100, happy + 3 + s * 2); upd(); };
  stage.addEventListener('pointerdown', (e) => { try { stage.setPointerCapture(e.pointerId); } catch {} start(e); });
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end); addEventListener('blur', end);
  // настроение понемногу спадает, чтобы был повод зайти
  const last = store.get('last', Date.now()); const days = (Date.now() - last) / 86400000; if (days > 0.5) { happy = Math.max(10, happy - days * 8); say('я скучал. где ты была?'); } store.set('last', Date.now()); upd();
})();
</script>
</body>
</html>
