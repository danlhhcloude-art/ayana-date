<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Страница, которая всегда знает, что сказать Аяне. Особенно ночью.">
  <meta name="theme-color" content="#05050f">
  <title>Спокойной ночи, Аяна</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: 'Manrope', system-ui, sans-serif; color: #eef0ff; background: #05050f; touch-action: manipulation; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 22px; text-align: center; transition: opacity 3s; }
    .ui.dim { opacity: .25; }
    .tag { font-family: 'Unbounded', sans-serif; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: #9d94c7; }
    h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(26px, 8vw, 40px); margin: 8px 0 10px; color: #fff; text-shadow: 0 0 14px rgba(255,255,255,.4); }
    .line { font-family: 'Caveat', cursive; font-size: clamp(24px, 7vw, 34px); line-height: 1.2; color: #fff; max-width: 440px; min-height: 80px; text-shadow: 0 2px 10px rgba(0,0,0,.6); opacity: 0; transform: translateY(8px); transition: 1.2s; }
    .line.show { opacity: 1; transform: none; }
    .days { margin-top: 18px; font-size: 13px; color: #9d94c7; }
    .days b { color: #ffd36b; }
    .row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .btn { font: inherit; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .05em; color: #fff; background: rgba(5,5,15,.5); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 12px 20px; cursor: pointer; text-decoration: none; backdrop-filter: blur(6px); }
    .btn.gold { border-color: #ffd36b; box-shadow: 0 0 12px rgba(255,211,107,.5); }
    .foot { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; color: #9d94c7; z-index: 2; }
    .foot a { color: #ff9ab8; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="ui" id="ui">
    <div class="tag" id="tag"></div>
    <h1 id="title"></h1>
    <div class="line" id="line"></div>
    <div class="days" id="days"></div>
    <div class="row"><button class="btn gold" id="mainBtn"></button><button class="btn" id="soundBtn">🔈</button></div>
  </div>
  <div class="foot" id="foot"><a href="../hub/">← все игры для Аяны</a></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const START = new Date(2026, 9, 14);
  const h = new Date().getHours();
  const part = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'day' : h >= 17 && h < 22 ? 'evening' : 'night';
  const P = {
    morning: { tag: 'доброе утро', title: 'Доброе утро, Аяна', lines: ['Ты проснулась, и день сразу стал лучше. У него просто не было шансов.', 'Выпей чего-нибудь тёплого. И не спеши. Я подожду здесь.', 'Сегодня у тебя всё получится. А если нет, я всё равно буду тобой гордиться.', 'Первая мысль утром снова была о тебе. Это уже традиция.'], btn: 'ещё одно утро', sky: ['#ffb37a', '#ffd6a8', '#bde3ff'] },
    day: { tag: 'добрый день', title: 'Привет, Аяна', lines: ['Середина дня. Ты, наверное, занята. Я просто напомню: ты молодец.', 'Отвлекись на минуту. Посмотри в окно. Там то же небо, под которым я думаю о тебе.', 'Пообедала? Если нет, это официальное напоминание. С любовью.', 'Даже в самый обычный день ты для меня не обычная.'], btn: 'ещё', sky: ['#7ec8ff', '#bfe3ff', '#eaf6ff'] },
    evening: { tag: 'добрый вечер', title: 'Добрый вечер, Аяна', lines: ['День закончился, а ты осталась. Спасибо, что ты есть и сегодня.', 'Как ты? Не отвечай сразу. Подумай. Мне правда важно.', 'Вечер для того, чтобы медленно. Чай, плед, что-нибудь тёплое. Я бы сидел рядом.', 'Если сегодня было тяжело, оно уже позади. Я горжусь тобой.'], btn: 'ещё', sky: ['#2a1848', '#c2416b', '#ff9a5c'] },
    night: { tag: 'спокойной ночи', title: 'Спокойной ночи, Аяна', lines: ['Уже поздно. Отложи всё. Мир прекрасно подождёт до утра.', 'Закрой глаза. Я посчитаю звёзды за тебя. Их, кстати, ровно столько, сколько раз я о тебе думал.', 'Если не спится, думай о чём-нибудь хорошем. Например, обо мне. Я разрешаю.', 'Ты сегодня справилась. Со всем. Теперь можно просто спать.', 'Я здесь. Тихо, чтобы не мешать. Засыпай.', 'Спокойной ночи. Люблю. До утра.'], btn: 'укладывай меня', sky: ['#05050f', '#0b0b22', '#141033'] },
  };
  const cfg = P[part];
  $('tag').textContent = cfg.tag; $('title').textContent = cfg.title; $('mainBtn').textContent = cfg.btn;
  const days = Math.max(1, Math.floor((new Date().setHours(0, 0, 0, 0) - START) / 86400000) + 1);
  $('days').innerHTML = `я думаю о тебе уже <b>${days}</b> ${days % 10 === 1 && days % 100 !== 11 ? 'день' : [2, 3, 4].includes(days % 10) && ![12, 13, 14].includes(days % 100) ? 'дня' : 'дней'} подряд. и это только те, что я считал.`;
  let li = -1;
  const next = () => { li = (li + 1) % cfg.lines.length; const el = $('line'); el.classList.remove('show'); setTimeout(() => { el.textContent = cfg.lines[li]; el.classList.add('show'); }, 400); };
  next();

  /* ночной режим: колыбельная и медленное затемнение */
  let ac, master, soundOn = false, lullTimer;
  const ensure = () => { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); const d = ac.createDelay(2); d.delayTime.value = 0.6; const fb = ac.createGain(); fb.gain.value = 0.45; d.connect(fb); fb.connect(d); d.connect(master); ac._d = d; };
  const note = (f, t, vol = 0.05, dur = 3) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); g.connect(ac._d); o.start(t); o.stop(t + dur + 0.1); };
  const BOX = [392, 440, 493.88, 523.25, 587.33, 659.25, 783.99];
  const lull = () => { if (!soundOn) return; const t = ac.currentTime + 0.05; note(BOX[Math.random() * BOX.length | 0], t); if (Math.random() < 0.5) note(BOX[Math.random() * 3 | 0] / 2, t + 0.3, 0.035, 4); lullTimer = setTimeout(lull, 900 + Math.random() * 1400); };
  const setSound = (on) => { ensure(); if (ac.state === 'suspended') ac.resume(); soundOn = on; $('soundBtn').textContent = on ? '🎧' : '🔈'; master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(on ? 1 : 0, ac.currentTime + 1); clearTimeout(lullTimer); if (on) lull(); };
  $('soundBtn').addEventListener('click', () => setSound(!soundOn));
  let sleeping = false;
  $('mainBtn').addEventListener('click', () => {
    if (part !== 'night') return next();
    if (!sleeping) { sleeping = true; setSound(true); $('mainBtn').textContent = 'ещё слово'; let k = 0; const seq = () => { next(); k++; if (k < cfg.lines.length) setTimeout(seq, 9000); else { $('ui').classList.add('dim'); $('foot').style.opacity = '0'; } }; seq(); } else next();
  });

  /* небо на canvas */
  const cv = $('cv'), ctx = cv.getContext('2d'); let W, H, DPR, stars = [], clouds = [], t = 0;
  const resize = () => { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; stars = []; for (let i = 0; i < 200; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.3, ph: Math.random() * 6, sp: 0.3 + Math.random() * 1.5, v: 0.02 + Math.random() * 0.05 }); clouds = []; for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.6, w: 120 + Math.random() * 200, v: 0.1 + Math.random() * 0.2 }); };
  addEventListener('resize', resize); resize();
  let shooting = null;
  const loop = () => {
    t += 0.016; ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, cfg.sky[0]); g.addColorStop(.6, cfg.sky[1]); g.addColorStop(1, cfg.sky[2]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (part === 'night' || part === 'evening') {
      ctx.fillStyle = '#fff'; for (const s of stars) { s.y += s.v; if (s.y > H) s.y = 0; ctx.globalAlpha = (part === 'night' ? 0.4 : 0.15) + 0.6 * Math.abs(Math.sin(t * s.sp + s.ph)) * (part === 'night' ? 1 : 0.4); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
      if (part === 'night') { ctx.fillStyle = '#fff3dc'; ctx.shadowBlur = 40; ctx.shadowColor = '#fff3dc'; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.15, 26, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = cfg.sky[0]; ctx.beginPath(); ctx.arc(W * 0.8 + 12, H * 0.15 - 8, 22, 0, 7); ctx.fill(); }
      if (!shooting && Math.random() < 0.004) shooting = { x: Math.random() * W, y: Math.random() * H * 0.4, life: 1 };
      if (shooting) { ctx.strokeStyle = `rgba(255,255,255,${shooting.life})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(shooting.x, shooting.y); ctx.lineTo(shooting.x - 60, shooting.y + 30); ctx.stroke(); shooting.x += 9; shooting.y += 4.5; shooting.life -= 0.02; if (shooting.life <= 0) shooting = null; }
    } else {
      for (const c of clouds) { c.x += c.v; if (c.x > W + c.w) c.x = -c.w; ctx.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(c.x + (i - 1.5) * c.w / 4, c.y + Math.sin(i * 2) * 8, c.w * 0.14, 0, 7); ctx.fill(); } }
      if (part === 'morning') { ctx.fillStyle = '#fff6d6'; ctx.shadowBlur = 60; ctx.shadowColor = '#ffd36b'; ctx.beginPath(); ctx.arc(W * 0.25, H * 0.78, 50, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
    }
    ctx.fillStyle = part === 'day' || part === 'morning' ? 'rgba(20,30,60,.9)' : '#06061a'; for (let i = 0; i < 28; i++) { const x = (i / 28) * W; const hh = 30 + ((i * 41) % 70); ctx.fillRect(x, H - hh, W / 28 + 1, hh); if (part === 'night' || part === 'evening') { ctx.fillStyle = 'rgba(255,214,160,.6)'; for (let y = H - hh + 8; y < H - 6; y += 12) if ((i * 7 + y) % 5 < 2) ctx.fillRect(x + 5, y, 3, 4); ctx.fillStyle = '#06061a'; } }
    ctx.restore(); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
